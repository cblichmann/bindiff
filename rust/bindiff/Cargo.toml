[package]
name = "bindiff"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
prost = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
rusqlite = { version = "0.30", features = ["bundled"] }
petgraph = "0.6"
anyhow = "1.0"
pbjson = "0.6"
pbjson-types = "0.6"

[build-dependencies]
prost-build = "0.12"
pbjson-build = "0.6"
